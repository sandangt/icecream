version: '3'

dotenv: ['.env']

vars:
  PROJECT_NAME: icecream
  LOCAL_STORE: ./.local-volumes
  REGISTRY_URL: code.sanlab.zone/sandang
  INTERNAL_NAMESPACE: icecream-internal
  PUBLIC_NAMESPACE: icecream-public

includes:
  deployment:
    taskfile: ./icecream-deployment/Taskfile.yaml
    dir: ./icecream-deployment
  image:
    taskfile: ./icecream-image/Taskfile.yaml
    dir: ./icecream-image

tasks:
  init-ns-internal:
    internal: true
    desc: Create namespace {{.NAMESPACE}}
    if: '! kubectl get ns {{.NAMESPACE}}'
    cmd: kubectl create ns {{.NAMESPACE}}
  end-ns-internal:
    internal: true
    desc: Delete namespace
    if: kubectl get ns {{.NAMESPACE}}
    cmd: kubectl delete ns {{.NAMESPACE}}
  init-ns:
    vars:
      ITEMS: '{{list .INTERNAL_NAMESPACE .PUBLIC_NAMESPACE | join ","}}'
    cmds:
      - for: { var: ITEMS, split: ',' }
        task: init-ns-internal
        vars: 
          NAMESPACE: '{{.ITEM}}'
  end-ns:
    vars:
      ITEMS: '{{list .INTERNAL_NAMESPACE .PUBLIC_NAMESPACE | join ","}}'
    cmds:
      - for: { var: ITEMS, split: ',' }
        task: end-ns-internal
        vars: 
          NAMESPACE: '{{.ITEM}}'
  getall:
    vars:
      ITEMS: '{{list .INTERNAL_NAMESPACE .PUBLIC_NAMESPACE | join ","}}'
    cmds:
      - for: { var: ITEMS, split: ',' }
        cmd: kubectl get all,cm,secrets,pvc,pv -n {{.ITEM}}
  deployment-a-z:
    desc: From run from tasks a-z
    cmds:
      - task: end-ns
      - task: init-ns
      - task: deployment:create-params
      - task: deployment:create-creds
      - task: deployment:install-infras
      - task: deployment:install-apps
