# conflux = consumer & enrichment service. No own DB.
# Consumes CDC events from kafka (produced by debezium off consul's postgres),
# enriches them, and pushes results into elasticsearch.
nameOverride: "conflux"
fullnameOverride: "conflux"

image:
  repository: registry.sanlab.zone/icecream/conflux
  tag: "1.0.0"

replicaCount: 2

containerPort: 8080
managementPort: 8080

resources:
  requests: { cpu: 150m, memory: 384Mi }
  limits:   { cpu: 500m, memory: 768Mi }

env:
  SPRING_PROFILES_ACTIVE: "k8s"
  CONFIG_SERVER_URL: "http://codex:80"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_ELASTICSEARCH_URIS: "http://elasticsearch:9200"

secret:
  create: false
  name: ""
