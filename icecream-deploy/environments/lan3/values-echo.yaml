# echo = asynchronous notification service (email/push/sms). MongoDB-backed.
# Consumes from rabbitmq (task queue) and kafka (message queue).
nameOverride: "echo"
fullnameOverride: "echo"

image:
  repository: registry.sanlab.zone/icecream/echo
  tag: "1.0.0"

replicaCount: 2

containerPort: 8080
managementPort: 8080

resources:
  requests: { cpu: 150m, memory: 384Mi }
  limits:   { cpu: 500m, memory: 768Mi }

env:
  SPRING_PROFILES_ACTIVE: "k8s"
  CONFIG_SERVER_URL: "http://codex:80"
  SPRING_DATA_MONGODB_URI_HOST: "echo-mongodb"
  SPRING_DATA_MONGODB_DATABASE: "echo"
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  MINIO_ENDPOINT: "http://minio:9000"

secret:
  create: false
  name: "echo-db-secret"
  # expected keys: SPRING_DATA_MONGODB_USERNAME, SPRING_DATA_MONGODB_PASSWORD, SPRING_RABBITMQ_USERNAME, SPRING_RABBITMQ_PASSWORD
