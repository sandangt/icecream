replicaCount: 1

image:
  repository: your-registry/your-springboot-app
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ''
fullnameOverride: ''

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

config:
  SPRING_PROFILES_ACTIVE: staging
  JAVA_TOOL_OPTIONS: '-XX:MaxRAMPercentage=75.0'
  exsitingConfigMap: ''

extraEnv: []

auth:
  existingSecret: ''

probes:
  startup:
    path: /actuator/health/liveness
    failureThreshold: 30
    periodSeconds: 5
  liveness:
    path: /actuator/health/liveness
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    periodSeconds: 10
    failureThreshold: 3

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

ingress:
  enabled: false
  className: ''
  annotations: {}
  host: app.example.com
  path: /
  pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
