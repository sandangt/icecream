replicaCount: 1

image:
  repository: your-registry/your-springboot-app
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ''
fullnameOverride: ''

service:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: rsocket
      port: 7000
      targetPort: 7000
      protocol: TCP

extraEnv: []

config:
  existingConfigMap: ''

auth:
  existingSecret: ''

probes:
  startup:
    httpGet:
      path: /actuator/health/liveness
      port: http
    failureThreshold: 30
    periodSeconds: 10
  liveness:
    httpGet:
      path: /actuator/health/liveness
      port: http
    failureThreshold: 3
    periodSeconds: 10
  readiness:
    httpGet:
      path: /actuator/health/readiness
      port: http
    failureThreshold: 3
    periodSeconds: 10

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

ingress:
  enabled: false
  className: ''
  annotations: {}
  host: app.example.com
  path: /
  pathType: Prefix
  tls: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
