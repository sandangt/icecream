nameOverride: ''
fullnameOverride: ''

replicaCount: 2

image:
  repository: ''
  tag: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []
podAnnotations: {}
podLabels: {}

auth:
  existingSecret: ''

config:
  existingConfigMap: ''

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

extraEnv: []

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

healthChecks:
  enabled: true
  path: /
  startup:
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

probes:
  startup:
    httpGet:
      path: /
      port: http
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    httpGet:
      path: /
      port: http
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  liveness:
    httpGet:
      path: /
      port: http
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

route:
  enabled: true
  hostname: icecream.sanlab.zone
  gatewayName: apisix-public
  gatewayNamespace: icecream
  sectionName: https
  pathPrefix: /
  filters: []
