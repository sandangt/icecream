      value: '{{.MONGODB_ECHO_DB}},{{.MONGODB_CHRONOS_DB}}'
    - name: GARAGE_API_PORT
      value: '{{.GARAGE_API_PORT}}'
    - name: GARAGE_UI_PORT
      value: '{{.GARAGE_UI_PORT}}'
    - name: GARAGE_HOST
      value: '{{.GARAGE_HOST}}'
    - name: STORAGE_URL
      value: '{{.STORAGE_URL}}'
    - name: ELASTICSEARCH_HOST
      value: '{{.ELASTICSEARCH_HOST}}'
    - name: ELASTICSEARCH_PORT
      value: '{{.ELASTICSEARCH_PORT}}'
    - name: ELASTICSEARCH_USERNAME
      value: '{{.ELASTICSEARCH_USERNAME}}'
