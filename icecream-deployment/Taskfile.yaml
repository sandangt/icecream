      value: '{{.KEYCLOAK_ADMIN_PASSWORD}}'
    - name: CONSUL_API_KEY_0
      value: '{{.CONSUL_API_KEY_0}}'
    - name: CONSUL_API_KEY_1
      value: '{{.CONSUL_API_KEY_1}}'
