nameOverride: codex
fullnameOverride: icecream-codex
image:
  repository: ghcr.io/sandangt/icecream-codex-app
  tag: sha-be115be

config:
  existingConfigMap: icecream-configmaps

auth:
  existingSecret: icecream-credentials

service:
  targetPort: 32010

extraEnv:
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
  - name: OTEL_LOGS_EXPORTER
    value: otlp
  - name: OTEL_METRICS_EXPORTER
    value: otlp
  - name: OTEL_TRACES_EXPORTER
    value: otlp
