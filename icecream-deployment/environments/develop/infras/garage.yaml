fullnameOverride: garage

auth:
  existingSecret: icecream-credentials

service:
  type: ClusterIP
  s3Port: 38003
  rpcPort: 38103
  uiPort: 38203

persistence:
  size: 30Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

webui:
  enabled: true
  image:
    repository: code.sanlab.zone/sandang/garage-ui
    tag: 1.1.0
    pullPolicy: IfNotPresent
