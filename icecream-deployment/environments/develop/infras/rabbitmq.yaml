fullnameOverride: rabbitmq

config:
  existingConfigMap: icecream-configmaps

auth:
  existingSecret: icecream-credentials

service:
  type: ClusterIP
  clusterIp:
    amqpPort: 38006
    managementPort: 38007

persistence:
  size: 2Gi

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 768Mi
