nameOverride: identity
fullnameOverride: icecream-identity

image:
  repository: code.sanlab.zone/sandang/icecream-identity
  tag: '0.1.0'
  pullPolicy: IfNotPresent

config:
  existingConfigMap: icecream-configmaps

auth:
  existingSecret: icecream-credentials

extraEnv:
  - name: KC_DB
    value: postgres
  - name: KC_HTTP_ENABLED
    value: 'true'
  - name: KC_HOSTNAME_STRICT
    value: 'true'
  - name: KC_HOSTNAME
    value: https://icecream-auth.sanlab.zone
  - name: KC_PROXY_HEADERS
    value: xforwarded
  - name: KC_HOSTNAME_ADMIN
    value: https://icecream-auth-admin.sanlab.zone

routes:
  storefrontClient:
    enabled: true
    hostname: icecream-auth.sanlab.zone
    gatewayName: apisix-public
    gatewayNamespace: icecream-public
    sectionName: http
    pathPrefix: /
    filters: []
  admin:
    enabled: true
    hostname: icecream-auth-admin.sanlab.zone
    gatewayName: apisix-public
    gatewayNamespace: icecream-public
    sectionName: http
    pathPrefix: /
    filters: []