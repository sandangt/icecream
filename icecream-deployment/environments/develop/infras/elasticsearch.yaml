fullnameOverride: elasticsearch

auth:
  existingSecret: icecream-credentials

config:
  existingConfigMap: icecream-configmaps

service:
  type: ClusterIP
  port: 38009

persistence:
  size: 15Gi

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: 1500m
    memory: 2Gi

initScripts:
  productIndex:
    enabled: true
    name: icecream.conflux.enriched.product
