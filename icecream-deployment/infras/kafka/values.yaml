image:
  repository: code.sanlab.zone/sandang/kafka
  tag: 7.8.4
  pullPolicy: IfNotPresent

fullnameOverride: ''

service:
  type: ClusterIP
  clusterIp:
    port: 38009
    internalPort: 38010
  nodePort:
    port: null
    internalPort: null

replicaCount: 1

auth:
  existingSecret: ''

config:
  existingConfigMap: ''
  clusterDomain: cluster.local
  replicationFactor: null
  minInsyncReplicas: null
  groupInitialRebalanceDelayMs: 0
  logCleanupPolicy: 'compact,delete'
  logCleanerMinCleanableRatio: 0.01
  logSegmentMs: 600000
  topicPartitions: 1
  topicInitRetryInterval: 5
  topicInitMaxAttempts: 60

topicInit:
  enabled: true
  backoffLimit: 6
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

persistence:
  enabled: true
  storageClass: longhorn
  size: 512Mi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 200m
    memory: 768Mi
  limits:
    memory: 1536Mi

podSecurityContext:
  fsGroup: 1000
nodeSelector: {}
tolerations: []
affinity: {}
imagePullSecrets: []
