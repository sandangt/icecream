apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "loki.fullname" . }}-config
  labels:
    {{- include "loki.labels" . | nindent 4 }}
data:
  loki-config.yaml: |
    auth_enabled: false

    server:
      http_listen_port: {{ .Values.service.port }}

    common:
      path_prefix: /loki
      storage:
        s3:
          endpoint: ${STORAGE_URL_NO_PROTOCOL}
          region: ${REGION}
          bucketnames: {{ .Values.config.s3Bucket }}
          access_key_id: ${AWS_ACCESS_KEY_ID}
          secret_access_key: ${AWS_SECRET_ACCESS_KEY}
          s3forcepathstyle: true
          insecure: true
      replication_factor: {{ .Values.replicaCount }}
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: {{ .Values.config.retentionPeriod }}
      ingestion_rate_mb: 100
      ingestion_burst_size_mb: 200
      allow_structured_metadata: true

    compactor:
      working_directory: /loki/retention
      compaction_interval: 10m
      retention_enabled: true
      delete_request_store: s3
