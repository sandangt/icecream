apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  labels: {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "rabbitmq.selectorLabels" . | nindent 4 }}
  ports:
    - name: amqp
      port: {{ .Values.service.amqpPort }}
      targetPort: amqp
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePorts.amqp }}
      nodePort: {{ .Values.service.nodePorts.amqp }}
      {{- end }}
    - name: management
      port: {{ .Values.service.managementPort }}
      targetPort: management
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePorts.management }}
      nodePort: {{ .Values.service.nodePorts.management }}
      {{- end }}
