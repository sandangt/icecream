apiVersion: v1
kind: Service
metadata:
  name: {{ include "rabbitmq.fullname" . }}
  labels: {{- include "rabbitmq.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector: {{- include "rabbitmq.selectorLabels" . | nindent 4 }}
  ports:
    - name: amqp
      port: {{ .Values.service.clusterIp.amqpPort }}
      targetPort: amqp
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort.amqpPort }}
      nodePort: {{ .Values.service.nodePort.amqpPort }}
      {{- end }}
    - name: management
      port: {{ .Values.service.clusterIp.managementPort }}
      targetPort: management
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort.managementPort }}
      nodePort: {{ .Values.service.nodePort.managementPort }}
      {{- end }}
