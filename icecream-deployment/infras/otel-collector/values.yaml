fullnameOverride: ''

image:
  repository: code.sanlab.zone/sandang/otel-collector
  tag: 2.17.4
  pullPolicy: IfNotPresent

replicaCount: 1

config:
  existingConfigMap: ''
  memoryLimitMib: 512
  exporters:
    lokiEndpoint: http://loki:3100/otlp
    tempoEndpoint: http://tempo:4318

service:
  type: ClusterIP
  port: 4318
  grpcPort: 4317
  metricsPort: 9464
  healthPort: 13133
  nodePort: null

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 768Mi

podSecurityContext: {}
nodeSelector: {}
affinity: {}
extraArgs: []
tolerations: []
imagePullSecrets: []
