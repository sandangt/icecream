fullnameOverride: ''

image:
  repository: code.sanlab.zone/sandang/otel-collector
  tag: 2.17.4
  pullPolicy: IfNotPresent

replicaCount: 1

config:
  existingConfigMap: ''
  exporters:
    lokiEndpoint: http://loki:39003/otlp
    tempoEndpoint: http://tempo:39004
    prometheusEndpoint: 0.0.0.0:39201

service:
  type: ClusterIP
  port: 39001
  grpcPort: 39101
  metricsPort: 39201
  healthPort: 13311
  nodePort: null

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 768Mi

podSecurityContext: {}
nodeSelector: {}
affinity: {}
extraArgs: []
tolerations: []
imagePullSecrets: []
