apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mimir.fullname" . }}-config
  labels:
    {{- include "mimir.labels" . | nindent 4 }}
data:
  mimir-config.yaml: |
    multitenancy_enabled: false

    server:
      http_listen_port: {{ .Values.service.port }}

    ingester:
      ring:
        replication_factor: {{ .Values.replicaCount }}

    common:
      storage:
        backend: s3
        s3:
          endpoint: ${STORAGE_URL_NO_PROTOCOL}
          bucket_name: {{ .Values.config.s3Bucket }}
          access_key_id: ${AWS_ACCESS_KEY_ID}
          secret_access_key: ${AWS_SECRET_ACCESS_KEY}
          insecure: true

    blocks_storage:
      tsdb:
        dir: /data/mimir/tsdb
      bucket_store:
        sync_dir: /data/mimir/tsdb-sync
      storage_prefix: blocks

    ruler_storage:
      storage_prefix: ruler

    alertmanager_storage:
      storage_prefix: alertmanager

    limits:
      compactor_blocks_retention_period: {{ .Values.config.blocksRetention }}

    compactor:
      data_dir: /data/mimir/compactor
      compaction_interval: 1h
