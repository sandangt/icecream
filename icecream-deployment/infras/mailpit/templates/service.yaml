apiVersion: v1
kind: Service
metadata:
  name: {{ include "mailpit.fullname" . }}
  labels: {{- include "mailpit.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  selector: {{- include "mailpit.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.clusterIp.httpPort }}
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort.httpPort }}
      nodePort: {{ .Values.service.nodePort.httpPort }}
      {{- end }}
    - name: smtp
      port: {{ .Values.service.clusterIp.smtpPort }}
      targetPort: smtp
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort.smtpPort }}
      nodePort: {{ .Values.service.nodePorts.smtpPort }}
      {{- end }}
