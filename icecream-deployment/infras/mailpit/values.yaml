fullnameOverride: ''

image:
  repository: code.sanlab.zone/sandang/mailpit
  tag: v1.28.2
  pullPolicy: IfNotPresent

replicaCount: 1

config:
  maxMessages: 5000
  smtpAuthAcceptAny: true
  smtpAuthAllowInsecure: true

service:
  type: ClusterIP
  clusterIp:
    httpPort: 8025
    smtpPort: 1025
  nodePort:
    httpPort: null
    smtpPort: null

persistence:
  storageClass: longhorn
  size: 1Gi
  accessModes:
    - ReadWriteOnce

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
imagePullSecrets: []
extraEnv: []
