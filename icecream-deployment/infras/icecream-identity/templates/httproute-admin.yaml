{{- if .Values.routes.admin.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "icecream-identity.fullname" . }}-admin
  namespace: {{ .Release.Namespace }}
  labels: {{- include "icecream-identity.labels" . | nindent 4 }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.routes.admin.gatewayName }}
      namespace: {{ .Values.routes.admin.gatewayNamespace }}
      sectionName: {{ .Values.routes.admin.sectionName }}
  hostnames:
    - {{ .Values.routes.admin.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.routes.admin.pathPrefix | quote }}
      {{- with .Values.routes.admin.filters }}
      filters: {{- toYaml . | nindent 8 }}
      {{- end }}
      backendRefs:
        - kind: Service
          name: {{ include "icecream-identity.fullname" . }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
