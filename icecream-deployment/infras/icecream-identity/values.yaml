nameOverride: ''
fullnameOverride: ''

image:
  repository: code.sanlab.zone/sandang/icecream-identity
  tag: '0.1.0'
  pullPolicy: IfNotPresent

replicaCount: 1

auth:
  existingSecret: ''

config:
  existingConfigMap: ''

service:
  type: ClusterIP
  port: 32000
  nodePort: null

routes:
  storefrontClient:
    enabled: true
    hostname: icecream-auth.sanlab.zone
    gatewayName: apisix-public
    gatewayNamespace: icecream-public
    sectionName: http
    pathPrefix: /
    filters: []
  admin:
    enabled: true
    hostname: icecream-auth-admin.sanlab.zone
    gatewayName: apisix-public
    gatewayNamespace: icecream-public
    sectionName: http
    pathPrefix: /
    filters: []

extraEnv: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

podSecurityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
imagePullSecrets: []
