{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "garage.secretName" . }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
type: Opaque
stringData:
  GARAGE_RPC_SECRET: {{ required "credentials.rpcSecret is required (or set credentials.existingSecret)" .Values.credentials.rpcSecret | quote }}
  GARAGE_ADMIN_TOKEN: {{ required "credentials.adminToken is required" .Values.credentials.adminToken | quote }}
  GARAGE_DEFAULT_ACCESS_KEY: {{ required "credentials.accessKey is required" .Values.credentials.accessKey | quote }}
  GARAGE_DEFAULT_SECRET_KEY: {{ required "credentials.secretKey is required" .Values.credentials.secretKey | quote }}
{{- end }}
