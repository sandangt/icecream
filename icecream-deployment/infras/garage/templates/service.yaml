apiVersion: v1
kind: Service
metadata:
  name: {{ include "garage.fullname" . }}
  labels:
    {{- include "garage.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "garage.selectorLabels" . | nindent 4 }}
  ports:
    - name: s3
      port: {{ .Values.service.s3.port }}
      targetPort: s3
      protocol: TCP
    - name: admin
      port: {{ .Values.service.admin.port }}
      targetPort: admin
      protocol: TCP
    {{- if .Values.service.web.enabled }}
    - name: web
      port: {{ .Values.service.web.port }}
      targetPort: web
      protocol: TCP
    {{- end }}
---
# Headless Service: stable network identity for the StatefulSet + RPC port
apiVersion: v1
kind: Service
metadata:
  name: {{ include "garage.fullname" . }}-headless
  labels:
    {{- include "garage.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "garage.selectorLabels" . | nindent 4 }}
  ports:
    - name: rpc
      port: 3901
      targetPort: rpc
      protocol: TCP
