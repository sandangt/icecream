{{- if .Values.provisioning.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "garage.fullname" . }}-provision
  labels:
    {{- include "garage.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.provisioning.backoffLimit }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "garage.name" . }}-provision
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: provision
          image: "{{ .Values.provisioning.image.repository }}:{{ .Values.provisioning.image.tag }}"
          imagePullPolicy: {{ .Values.provisioning.image.pullPolicy }}
          env:
            - name: GARAGE_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "garage.secretName" . }}
                  key: GARAGE_ADMIN_TOKEN
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "garage.secretName" . }}
                  key: GARAGE_DEFAULT_ACCESS_KEY
          {{- with .Values.provisioning.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              API="http://{{ include "garage.fullname" . }}:{{ .Values.service.admin.port }}"
              AUTH="Authorization: Bearer ${GARAGE_ADMIN_TOKEN}"
              JSON="Content-Type: application/json"

              wait_for() {
                desc="$1"; shift
                n=0
                until "$@" >/dev/null 2>&1; do
                  n=$((n+1))
                  if [ "$n" -ge 90 ]; then echo "Timed out waiting for $desc" >&2; exit 1; fi
                  sleep 2
                done
                echo "$desc: ready"
              }

              wait_for "Garage health" curl -fsS "$API/health"
              wait_for "default access key" curl -fsS -H "$AUTH" "$API/v2/GetKeyInfo?id=${GARAGE_DEFAULT_ACCESS_KEY}"

              # Prints the bucket ID, creating the bucket if it does not exist yet.
              ensure_bucket() {
                if ! info=$(curl -fsS -H "$AUTH" "$API/v2/GetBucketInfo?globalAlias=$1" 2>/dev/null); then
                  info=$(curl -fsS -H "$AUTH" -H "$JSON" -X POST \
                    -d "{\"globalAlias\":\"$1\"}" "$API/v2/CreateBucket")
                fi
                printf '%s' "$info" | tr -d ' \n\r' | grep -o '"id":"[0-9a-f]*"' | head -n1 | cut -d'"' -f4
              }

              allow_key() {
                curl -fsS -H "$AUTH" -H "$JSON" -X POST \
                  -d "{\"bucketId\":\"$1\",\"accessKeyId\":\"${GARAGE_DEFAULT_ACCESS_KEY}\",\"permissions\":{\"read\":true,\"write\":true,\"owner\":true}}" \
                  "$API/v2/AllowBucketKey" >/dev/null
              }

              make_public() {
                curl -fsS -H "$AUTH" -H "$JSON" -X POST \
                  -d '{"websiteAccess":{"enabled":true,"indexDocument":"{{ .Values.garage.web.index }}"}}' \
                  "$API/v2/UpdateBucket?id=$1" >/dev/null
              }

              {{- range .Values.provisioning.buckets }}
              id=$(ensure_bucket {{ . | quote }}); allow_key "$id"; echo "Bucket ready: {{ . }}"
              {{- end }}

              {{- range .Values.provisioning.publicBuckets }}
              id=$(ensure_bucket {{ . | quote }}); allow_key "$id"; make_public "$id"; echo "Bucket public via web endpoint: {{ . }}"
              {{- end }}

              echo "Garage provisioning done"
{{- end }}
