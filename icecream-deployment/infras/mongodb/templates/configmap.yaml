apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mongodb.fullname" . }}-init
  labels: {{- include "mongodb.labels" . | nindent 4 }}
data:
  init-mongo.sh: |
    #!/bin/bash
    # Sourced by the mongo entrypoint on first start (empty /data/db) only.
    set -e

    if [ -n "${MONGO_MULTIPLE_DATABASES:-}" ]; then
      echo "Creating multiple databases: ${MONGO_MULTIPLE_DATABASES}"
      for dbname in $(echo "${MONGO_MULTIPLE_DATABASES}" | tr ',' ' '); do
        echo "  Creating database: ${dbname}"
        mongosh --quiet \
          --username "${MONGO_INITDB_ROOT_USERNAME}" \
          --password "${MONGO_INITDB_ROOT_PASSWORD}" \
          --authenticationDatabase admin \
          --eval "const d = db.getSiblingDB('${dbname}'); if (!d.getCollectionNames().includes('initCollection')) { d.createCollection('initCollection'); }"
      done
    fi
