{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "postgresql.fullname" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.secretPasswordKey }}: {{ required "auth.password (or auth.existingSecret) is required" .Values.auth.password | quote }}
{{- end }}
