apiVersion: v1
kind: Service
metadata:
  name: {{ include "pg.fullname" . }}-headless
  labels: {{- include "pg.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "pg.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql

---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "pg.fullname" . }}
  labels: {{- include "pg.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "pg.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: postgresql
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
