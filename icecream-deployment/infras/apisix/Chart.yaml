apiVersion: v2
name: apisix-gateway
description: Apache APISIX gateway + APISIX Ingress Controller (standalone mode, no etcd)
type: application
version: 0.1.0
appVersion: 1.0.0
dependencies:
  - name: apisix
    alias: dataplane
    version: 3.1.0
    repository: https://apache.github.io/apisix-helm-chart
  - name: apisix-ingress-controller
    alias: controller
    version: 1.5.0
    repository: https://apache.github.io/apisix-helm-chart
