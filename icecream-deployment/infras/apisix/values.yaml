profile: internal

gatewayClass:
  name: apisix
  controllerName: apisix.apache.org/icecream

gateway:
  name: apisix-internal
  proxyParametersName: ''
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: apisix-internal-gateway.icecream.svc.cluster.local
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: icecream
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute

dataplane:
  nameOverride: apisix-internal
  fullnameOverride: apisix-internal
  replicaCount: 1
  image:
    tag: 3.21.0-ubuntu
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    annotations: {}
    externalTrafficPolicy: Cluster
    http:
      enabled: true
      servicePort: 80
      containerPort: 9080
    tls:
      servicePort: 443
  apisix:
    ssl:
      enabled: false
      containerPort: 9443
    admin:
      enabled: true
      enable_admin_ui: false
      type: ClusterIP
      port: 9180
      servicePort: 9180
      credentials:
        secretName: apisix-internal-admin-credentials
        secretAdminKey: admin
        secretViewerKey: viewer
      allow:
        ipList:
          - 127.0.0.0/8
          - 10.244.0.0/16
    deployment:
      mode: traditional
      role: traditional
      role_traditional:
        config_provider: yaml
  etcd:
    enabled: false
  ingress-controller:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  podDisruptionBudget:
    enabled: false
    minAvailable: 1

controller:
  deployment:
    replicas: 1
  config:
    controllerName: apisix.apache.org/icecream
    disableGatewayAPI: false
    listenerPortMatchMode: auto
    leaderElection:
      id: icecream-apisix-internal-leader
    provider:
      type: apisix-standalone
    kubernetes:
      ingressClass: apisix-internal
  crds:
    gatewayAPI:
      enabled: true
  apisix:
    adminService:
      namespace: icecream
      name: apisix-internal-admin
      port: 9180
  gatewayProxy:
    createDefault: true
    provider:
      type: ControlPlane
      controlPlane:
        service:
          name: apisix-internal-admin
          port: 9180
        auth:
          type: AdminKey
          adminKey:
            valueFrom:
              secretKeyRef:
                name: apisix-internal-admin-credentials
                key: admin
    publishService: ''
  serviceMonitor:
    enabled: false

networkPolicy:
  enabled: false
  clientNamespace: icecream
  clientPodSelector:
    app.kubernetes.io/name: storefront
  gatewayPort: 9080
  adminPort: 9180
  controllerPodSelector:
    app.kubernetes.io/name: apisix-ingress-controller
    app.kubernetes.io/instance: apisix-internal

internalRoute:
  hostname: apisix-internal-gateway.icecream.svc.cluster.local
  services:
    - name: icecream-consul
      port: 32001
      pathPrefix: /consul
    - name: icecream-echo
      port: 32002
      pathPrefix: /echo

externalRoutes:
  media:
    enabled: true
    hostname: icecream-media.sanlab.zone
    gatewayName: apisix-public
    gatewayNamespace: icecream-public
    sectionName: http
    pathPrefix: /
    filters: []
    backendHostname: garage
    backendPort: 38004
