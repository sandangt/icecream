server:
  address: 0.0.0.0
  port: ${CHRONOS_PORT}
  servlet.context-path: /scheduler

spring:
  application:
    name: chronos
  data:
    mongodb:
      database: ${MONGODB_CHRONOS_DB}
    redis:
      database: 2
  cloud:
    function:
      definition: helloRabbit;deleteImage # Consumer bean name
    stream:
      bindings:
        deleteImage-in-0:
          binder: rabbit-binder
          destination: icecream.consul.media.delete-image
          group: chronos-consumer-group
        helloRabbit-in-0:
          group: chronos-consumer-group
        helloKafka-in-0:
          group: chronos-consumer-group

otel:
  instrumentation:
    mongodb.enabled: true
