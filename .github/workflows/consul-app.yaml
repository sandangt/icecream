name: "Icecream Consul app script"

on:
  workflow_dispatch:
    inputs:
      ENV:
        type: choice
        options: [DEV, STAG, PROD]
        required: true
        default: DEV

run-name: "[${{ inputs.ENV }}](🚀): consul-app"

jobs:
  build:
    name: Build Icecream Consul App (${{ inputs.ENV }})
    uses: ./.github/workflows/build-spring-boot-app.yaml
    with:
      root-path: icecream-system
      module: consul
      image-name: icecream-consul-app
      ENV: ${{ inputs.ENV }}
    secrets: inherit
