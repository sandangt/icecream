name: "Build memoir service"

on:
  workflow_dispatch:
    inputs:
      ENV:
        type: choice
        options: [DEV, STAG, PROD]
        required: true
        default: DEV

run-name: "[${{ inputs.ENV }}](🚀): memoir-service"

jobs:
  build:
    name: Build Memoir Service (${{ inputs.ENV }})
    uses: ./.github/workflows/build-spring-boot-service.yaml
    with:
      root-path: icecream-system
      module: memoir
      image-name: icecream-memoir-service
      ENV: ${{ inputs.ENV }}
    secrets: inherit
