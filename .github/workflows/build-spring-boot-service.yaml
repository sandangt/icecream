name: Reusable spring boot service workflow template

on:
  workflow_call:
    inputs:
      module:
        description: "Maven artifactId of the module to build (e.g. consul)"
        required: true
        type: string
      image-name:
        description: "GHCR image name (defaults to the module name)"
        required: false
        type: string
        default: ""
      ENV:
        type: string
        description: Environment
        required: true
      root-path:
        type: string
        description: Root path for group of services (e.g. icecream-system, icecream-ui ...)
        required: true
    outputs:
      image-tag:
        description: "Full image reference(s) that were built/pushed"
        value: ${{ jobs.build.outputs.image-tag }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ inputs.module }} for ${{ inputs.ENV }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.ENV }}
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build ${{ inputs.module }}
        working-directory: ${{ inputs.root-path }}
        run: |
          mvn --batch-mode --no-transfer-progress -pl ${{ inputs.module }} -am clean package -DskipTests
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name != '' && inputs.image-name || inputs.module }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
      - name: Build & push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.root-path }}
          file: ${{ inputs.root-path }}/${{ inputs.module }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.module }}
          cache-to: type=gha,mode=max,scope=${{ inputs.module }}
