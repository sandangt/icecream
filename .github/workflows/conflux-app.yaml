name: "Icecream Conflux app script"

on:
  workflow_dispatch:
    inputs:
      ENV:
        type: choice
        options: [DEV, STAG, PROD]
        required: true
        default: DEV

run-name: "[${{ inputs.ENV }}](🚀): conflux-app"

jobs:
  build:
    name: Build Icecream Conflux App (${{ inputs.ENV }})
    uses: ./.github/workflows/build-spring-boot-app.yaml
    with:
      root-path: icecream-system
      module: conflux
      image-name: icecream-conflux-app
      ENV: ${{ inputs.ENV }}
    secrets: inherit
